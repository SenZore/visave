name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: python -m unittest discover -s tests/native -v
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/bootstrap-check.ps1
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/media-tools-check.ps1
      - run: npm run build
